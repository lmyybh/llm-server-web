[project]
name = "llmbench"
version = "0.1.0"
description = "Load generation and measurement kernel for the LLM serving bench & inspection site"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
llmbench = "llmbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llmbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
