  <script>
    const definitions = [
      {id:"health.generate",title:"生成接口健康检查",group:"基础接口",method:"POST",path:"/v1/chat/completions",body:{model:"DeepSeek-V4-Flash",messages:[{role:"user",content:"Reply with pong."}],max_tokens:8}},

      {id:"streaming.basic",title:"流式响应与结束标记",group:"基础接口",method:"POST",path:"/v1/chat/completions",body:{model:"DeepSeek-V4-Flash",messages:[{role:"user",content:"Count to three"}],stream:true,max_tokens:32}},
      {id:"validation.malformed_json",title:"拒绝损坏的 JSON",group:"异常输入",method:"POST",path:"/v1/chat/completions",body:'{"model":'},

      {id:"validation.wrong_field_type",title:"错误字段类型",group:"异常输入",method:"POST",path:"/v1/chat/completions",body:{model:"DeepSeek-V4-Flash",messages:"not-an-array"}},
      {id:"output.small_limit",title:"输出上限生效",group:"边界行为",method:"POST",path:"/v1/chat/completions",body:{model:"DeepSeek-V4-Flash",messages:[{role:"user",content:"Write a paragraph"}],max_tokens:2}},
      {id:"context.overflow",title:"超出上下文长度",group:"边界行为",method:"POST",path:"/v1/chat/completions",body:{model:"DeepSeek-V4-Flash",messages:[{role:"user",content:"x ".repeat(120)}],max_tokens:1}},
      {id:"extensions.tools",title:"工具调用能力",group:"可选能力",method:"POST",path:"/v1/chat/completions",body:{model:"DeepSeek-V4-Flash",messages:[{role:"user",content:"What is the weather?"}],tools:[{type:"function",function:{name:"weather",parameters:{type:"object"}}}]}},
      {id:"extensions.thinking",title:"思考模式开关",group:"可选能力",method:"POST",path:"/v1/chat/completions",body:{model:"DeepSeek-V4-Flash",messages:[{role:"user",content:"Solve 2+2"}],extra_body:{enable_thinking:true}}},
      {id:"disruption.abort_storm",title:"客户端中断场景",group:"扰动恢复",method:"POST",path:"/v1/chat/completions",body:{model:"DeepSeek-V4-Flash",messages:[{role:"user",content:"Generate a long response"}],stream:true,max_tokens:256}}

    const variants = [{key:"a",name:"三栏工作台"},{key:"b",name:"看板与证据区"},{key:"c",name:"时间线详情"}];
    const selected = new URLSearchParams(location.search).get("variant");
    const state = {variant:variants.some(item=>item.key===selected)?selected:"a",enabled:definitions.map(item=>item.id),runId:129,caseId:"validation.malformed_json",debug:false,runs:[]};
    const allIds = definitions.map(item=>item.id);
    function sampleRun(id,status,time,failAt,doneCount){
      return {id:id,status:status,time:time,items:definitions.map((definition,index)=>({id:definition.id,status:index<doneCount?(index===failAt?"fail":"pass"):status==="running"&&index===doneCount?"running":"waiting",duration:index<doneCount?(240+index*137)+" ms":""}))};

    state.runs=[sampleRun(129,"running","今天 14:32",-1,3),sampleRun(128,"failed","今天 10:18",3,11),sampleRun(127,"completed","昨天 16:44",-1,11)];
    function esc(value){return String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]));}

    function currentCase(){return current().items.find(item=>item.id===state.caseId)||current().items[0];}
    function definition(id){return definitions.find(item=>item.id===id);}
    function completed(run){return run.items.filter(item=>item.status==="pass"||item.status==="fail"||item.status==="skipped").length;}
    function failures(run){return run.items.filter(item=>item.status==="fail").length;}
    function statusLabel(run){return run.status==="running"?"运行中":run.status==="completed"?"通过":"失败";}
    function chip(run){return '<span class="status-chip '+(run.status==="completed"?"done":run.status==="failed"?"failed":"")+'">'+(run.status==="running"?'<span class="spin"></span>':'')+statusLabel(run)+'</span>';}
    function progress(run){return '<div class="progress-line"><span>用例进度 '+completed(run)+' / '+run.items.length+'</span><span>'+Math.round(completed(run)/run.items.length*100)+'%</span></div><div class="progress-track"><div class="progress-fill" style="width:'+Math.round(completed(run)/run.items.length*100)+'%"></div></div>';}
    function icon(item){return '<span class="case-icon '+item.status+'">'+(item.status==="pass"?"✓":item.status==="fail"?"!":item.status==="waiting"?"○":"")+'</span>';}
    function endText(item){return item.status==="pass"?"已完成":item.status==="fail"?"验证失败":item.status==="running"?"执行中":"等待";}
    function caseRows(run){return run.items.map(item=>{const d=definition(item.id);return '<button class="case-row '+(state.caseId===item.id?"active":"")+'" type="button" data-case="'+esc(item.id)+'">'+icon(item)+'<span class="case-main"><strong>'+esc(d.title)+'</strong><small>'+esc(item.id)+'</small></span><span class="case-end '+item.status+'">'+endText(item)+'</span></button>';}).join("");}
    function historyList(){return '<section class="panel"><div class="panel-head"><div><h2>历史巡检</h2><p>选择一条记录查看执行过程</p></div><span class="count">'+state.runs.length+' 条</span></div><div class="history-list">'+state.runs.map(run=>'<button class="history-item '+(run.id===state.runId?"active":"")+'" type="button" data-run="'+run.id+'"><span class="history-top"><span class="history-id">巡检 #'+run.id+'</span>'+chip(run)+'</span><span class="history-meta">'+run.time+'</span><span class="history-results">'+completed(run)+' / '+run.items.length+' 完成'+(failures(run)?' · '+failures(run)+' 项失败':'')+'</span></button>').join("")+'</div></section>';}
    function runHead(run){return '<div class="panel-head"><div><div class="run-title"><strong>巡检 #'+run.id+'</strong>'+chip(run)+'</div><p>'+run.time+' · '+run.items.length+' 项巡检</p></div><button class="btn small" type="button" data-action="advance" '+(run.status!=="running"?"disabled":"")+'>推进一步</button></div><div style="padding:0 18px 13px">'+progress(run)+'</div>';}
    function evidence(run,item){const d=definition(item.id);if(item.status==="waiting")return '<div class="evidence"><h3>'+esc(d.title)+'</h3><p class="evidence-sub">'+esc(d.id)+'</p><div class="evidence-placeholder">该用例尚未执行。执行后可在此查看完整请求、响应和错误信息。</div></div>';const body=typeof d.body==="string"?d.body:JSON.stringify(d.body,null,2);const response=item.status==="running"?"等待服务响应…":item.status==="fail"?JSON.stringify({id:"chatcmpl-9d1",choices:[{message:{role:"assistant",content:""}}]},null,2):JSON.stringify(d.id.startsWith("validation.")?{error:{message:"Invalid request body",type:"invalid_request_error"}}:{id:"chatcmpl-9d1",object:"chat.completion",choices:[{message:{role:"assistant",content:"pong"},finish_reason:"stop"}]},null,2);return '<div class="evidence"><h3>'+esc(d.title)+'</h3><p class="evidence-sub">'+esc(d.id)+' · '+endText(item)+(item.duration?' · '+item.duration:'')+'</p><div class="meta-line"><span><b>请求</b> '+d.method+' '+d.path+'</span><span><b>响应</b> '+(item.status==="running"?"等待中":item.status==="fail"?"HTTP 200":"HTTP 200 / 422")+'</span></div><div class="evidence-grid"><div class="evidence-box"><h4>请求体 <span>完整内容</span></h4><pre>'+esc(body)+'</pre></div><div class="evidence-box"><h4>响应内容 <span>完整内容</span></h4><pre>'+esc(response)+'</pre></div>'+(item.status==="fail"?'<div class="evidence-box error"><h4>完整错误信息 <span>不截断</span></h4><pre>'+esc(errorText)+'</pre></div>':'')+'</div></div>';}
    function layoutA(run,item){return '<div class="a-layout">'+historyList()+'<section class="panel">'+runHead(run)+'<div class="case-list">'+caseRows(run)+'</div></section><section class="panel evidence-panel"><div class="panel-head"><div><h2>请求与响应</h2><p>点击用例查看完整证据</p></div></div>'+evidence(run,item)+'</section></div>';}
    function layoutB(run,item){return '<div class="b-layout"><div class="b-top"><section class="panel b-history"><div class="panel-head"><div><h2>历史巡检</h2><p>每条记录保留其用例和请求证据</p></div></div><table class="history-table"><thead><tr><th>记录</th><th>时间</th><th>进度</th><th>结果</th></tr></thead><tbody>'+state.runs.map(r=>'<tr data-run="'+r.id+'" class="'+(r.id===run.id?"active":"")+'"><td><button type="button" data-run="'+r.id+'" aria-label="查看巡检 #'+r.id+'">#'+r.id+'</button></td><td>'+r.time+'</td><td>'+completed(r)+' / '+r.items.length+'</td><td>'+chip(r)+'</td></tr>').join("")+'</tbody></table></section><section class="panel b-run-summary">'+chip(run)+'<h2 style="margin-top:10px">巡检 #'+run.id+'</h2><p>先看整体进度，再逐项查看证据</p>'+progress(run)+'</section></div><section class="panel"><div class="panel-head"><div><h2>巡检项看板</h2><p>勾选项按执行顺序展示；点击进入证据区</p></div><span class="count">'+run.items.length+' 项</span></div><div class="b-case-grid" style="padding:13px">'+run.items.map(entry=>{const d=definition(entry.id);return '<button type="button" data-case="'+esc(entry.id)+'" class="b-case '+(entry.id===item.id?"active":"")+'">'+icon(entry)+'<strong>'+esc(d.title)+'</strong><span class="case-end '+entry.status+'">'+endText(entry)+'</span><small>'+esc(entry.id)+'</small></button>';}).join("")+'</div></section><section class="panel b-evidence"><div class="panel-head"><div><h2>用例证据</h2><p>请求体、响应内容及完整错误信息</p></div></div>'+evidence(run,item)+'</section></div>';}
    function layoutC(run,item){return '<div class="c-layout">'+historyList()+'<section class="panel">'+runHead(run)+'<div class="c-timeline">'+run.items.map(entry=>{const d=definition(entry.id);return '<div class="timeline-row"><span class="timeline-dot '+entry.status+'">'+(entry.status==="pass"?"✓":entry.status==="fail"?"!":entry.status==="waiting"?"○":"")+'</span><button type="button" data-case="'+esc(entry.id)+'" class="timeline-heading"><span><strong>'+esc(d.title)+'</strong><br><small>'+esc(entry.id)+'</small></span><span class="case-end '+entry.status+'">'+endText(entry)+'</span></button>'+(entry.id===item.id?'<div class="timeline-evidence">'+evidence(run,entry)+'</div>':'')+'</div>';}).join("")+'</div></section></div>';}
    function render(){const run=current(),item=currentCase();document.getElementById("enabled-count").textContent=state.enabled.length;document.getElementById("stats").innerHTML='<div class="stat"><span>最近一次巡检</span><strong class="blue">#'+state.runs[0].id+'</strong></div><div class="stat"><span>当前进度</span><strong>'+completed(run)+' <small>/ '+run.items.length+' 项</small></strong></div><div class="stat"><span>历史记录</span><strong>'+state.runs.length+' <small>次</small></strong></div><div class="stat"><span>当前判定</span><strong class="'+(run.status==="completed"?"green":"blue")+'">'+statusLabel(run)+'</strong></div>';document.getElementById("view").innerHTML=state.variant==="a"?layoutA(run,item):state.variant==="b"?layoutB(run,item):layoutC(run,item);document.getElementById("variant-label").textContent=state.variant.toUpperCase()+" · "+variants.find(v=>v.key===state.variant).name;document.getElementById("state-panel").hidden=!state.debug;document.getElementById("state-panel").textContent=JSON.stringify({variant:state.variant,enabledCaseIds:state.enabled,selectedRunId:run.id,selectedCaseId:item.id,runs:state.runs.map(r=>({id:r.id,status:r.status,cases:r.items.map(c=>({id:c.id,status:c.status}))}))},null,2);}
    function renderOptions(){const grouped=[...new Set(definitions.map(d=>d.group))];document.getElementById("case-options").innerHTML=grouped.map(group=>'<div class="group-label">'+esc(group)+'</div>'+definitions.filter(d=>d.group===group).map(d=>'<label class="check-row"><input type="checkbox" value="'+esc(d.id)+'" '+(state.enabled.includes(d.id)?"checked":"")+'><span><strong>'+esc(d.title)+'</strong><small>'+esc(d.id)+'</small></span></label>').join("")).join("");updateManageHint();}
    function updateManageHint(){document.getElementById("manage-hint").textContent='已选择 '+document.querySelectorAll('#case-options input:checked').length+' / '+definitions.length+' 项';}
    function switchVariant(step){const index=variants.findIndex(v=>v.key===state.variant);state.variant=variants[(index+step+variants.length)%variants.length].key;const url=new URL(location.href);url.searchParams.set("variant",state.variant);history.replaceState(null,"",url);render();}
    function startRun(){if(!state.enabled.length){document.getElementById("manage-dialog").showModal();renderOptions();return;}const nextId=state.runs[0].id+1;const items=definitions.filter(d=>state.enabled.includes(d.id)).map((d,index)=>({id:d.id,status:index===0?"running":"waiting",duration:""}));state.runs.unshift({id:nextId,status:"running",time:"刚刚",items:items});state.runId=nextId;state.caseId=items[0].id;render();}
    function advance(){const run=current();if(run.status!=="running")return;const active=run.items.findIndex(item=>item.status==="running");if(active<0)return;const item=run.items[active];item.status=item.id==="validation.malformed_json"?"fail":"pass";item.duration=(210+active*96)+" ms";if(run.items[active+1]){run.items[active+1].status="running";state.caseId=run.items[active+1].id;}else{run.status=run.items.some(entry=>entry.status==="fail")?"failed":"completed";state.caseId=item.id;}render();}
    document.addEventListener("click",event=>{const button=event.target.closest("[data-action], [data-run], [data-case]");if(!button)return;if(button.dataset.run){state.runId=Number(button.dataset.run);state.caseId=current().items[0].id;render();return;}if(button.dataset.case){state.caseId=button.dataset.case;render();return;}const action=button.dataset.action;if(action==="manage"){renderOptions();document.getElementById("manage-dialog").showModal();}else if(action==="close-manage")document.getElementById("manage-dialog").close();else if(action==="save-manage"){state.enabled=[...document.querySelectorAll('#case-options input:checked')].map(input=>input.value);document.getElementById("manage-dialog").close();render();}else if(action==="start")startRun();else if(action==="advance")advance();else if(action==="previous")switchVariant(-1);else if(action==="next")switchVariant(1);else if(action==="state"){state.debug=!state.debug;render();}});
    document.getElementById("case-options").addEventListener("change",updateManageHint);
    document.addEventListener("keydown",event=>{if(event.key!=="ArrowLeft"&&event.key!=="ArrowRight")return;const active=document.activeElement;if(active&&(["INPUT","TEXTAREA","SELECT"].includes(active.tagName)||active.isContentEditable))return;event.preventDefault();switchVariant(event.key==="ArrowRight"?1:-1);});
    render();
  </script>
</body>
</html>
