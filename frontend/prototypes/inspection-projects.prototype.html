/* Layout A: fixed page shell; only the table scrolls. */
html,body{height:100%;overflow:hidden}
.shell{height:calc(100dvh - 64px);min-height:0;overflow:hidden}
main{height:100%;min-height:0;display:flex;flex-direction:column;gap:10px;padding:16px 28px 10px;margin:0 auto;overflow:hidden}
.crumb,.heading .subtle,.design-caption,.switcher{display:none}
.heading{flex-shrink:0;align-items:center;gap:16px;margin:0}
.heading>div{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
h1{font-size:23px;letter-spacing:0;margin:0}
.summary{margin:0;gap:14px}.summary b{font-size:14px}
.heading>button{padding:7px 11px;white-space:nowrap;font-size:12px}
.hint{flex-shrink:0;border:0;background:none;padding:0;margin:0;color:#8090a5;font-size:11px;line-height:1.5}
.toolbar{flex-shrink:0;margin:0;gap:8px}.toolbar input,.toolbar select{padding:8px 11px;font-size:12px}.search{width:280px}
#view{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.surface.table-wrap{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
table{border-collapse:separate;border-spacing:0;min-width:690px}
th{position:sticky;top:0;z-index:1;background:#f8fafc;box-shadow:0 1px 0 #e4e9f0;padding:12px 16px}
td{padding:10px 16px}.row-note{margin:5px 0 0;max-width:380px}.id{margin-top:4px}
.footer-note{flex-shrink:0;margin:0;font-size:10px;line-height:1.4}
@media(max-width:1100px){main{padding:16px 20px 10px}.row-note{display:block}.heading>div{gap:14px}.summary{gap:10px}}
@media(max-width:760px){main{padding:12px;gap:8px}.heading{flex-wrap:nowrap;align-items:flex-start}.heading>div{gap:6px}.summary{font-size:10px;gap:8px}.summary b{font-size:12px}.search{width:auto;min-width:100px;flex:1}.toolbar select{min-width:100px}.toolbar .spacer,.toolbar .count{display:none}.hint{font-size:10px}h1{font-size:20px}}
.group-badge{display:inline-flex;align-items:center;gap:6px;border:1px solid;font-weight:500;padding:3px 8px}
.group-badge:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.group-basic{color:#3978c6;background:#edf5ff;border-color:#cfe2fa}
.group-invalid{color:#c15d7d;background:#fff0f5;border-color:#f3d3df}
.group-boundary{color:#ae8228;background:#fff8e5;border-color:#f1e1b4}
.group-optional{color:#9461c4;background:#f6efff;border-color:#e5d4f6}
.group-disruption{color:#31977e;background:#ebfaf4;border-color:#c5eadd}
.group-badge:before{opacity:1}

<main><div class="crumb">配置管理 <span style="margin:0 9px">/</span><span>巡检项目</span></div><div class="heading"><div><h1>巡检项目</h1><p class="subtle">统一查看检查内容、判断标准和执行设置。</p><div class="summary"><span><b>11</b> 个内置项目</span><span><b id="defaultCount">10</b> 项默认选中</span><span class="badge blue">用例集 v8</span></div></div><button id="restore">恢复初始设置</button></div>

<script>
const rows=[
['health.generate','生成接口健康检查','基础接口','检查服务自带的生成健康入口。',['请求 /health_generate，等待服务响应。'],'返回 HTTP 200。','返回其他 HTTP 状态码。','连接失败或超时显示执行出错。',60,true,'GET /health_generate'],
['completion.non_stream','非流式响应格式','基础接口','确认普通聊天请求能返回完整、合法的响应。',['发送“Reply with pong.”，关闭流式输出。','检查回复结构、用量字段和结束原因，不核对回答是否为 pong。'],'HTTP 200，包含 choices、message、usage，结束原因合法。','回复结构不完整或 HTTP 状态异常。','连接失败或超时显示执行出错。',60,true,'POST /v1/chat/completions'],
['streaming.basic','流式响应与结束标记','基础接口','检查流式数据能被解析，并明确结束。',['开启流式输出，发送“Reply with pong.”。','逐条解析事件，检查结束原因和 [DONE]。'],'收到可解析事件、合法结束原因及 [DONE]。','事件格式错误、缺少事件或结束标记。','连接失败或超时显示执行出错。',60,true,'POST /v1/chat/completions'],
['validation.malformed_json','拒绝损坏的 JSON','异常输入','发送不完整的请求，检查服务能否正确拒绝。',['发送不完整的 JSON：{"model":。'],'结构化 400/422，错误指向 JSON 解析。','请求被接受，或服务返回 5xx。','鉴权、限流或拒绝原因不明时无法判定。',60,true,'POST /v1/chat/completions'],
['validation.missing_messages','缺失 messages 字段','异常输入','检查聊天接口是否校验必需字段。',['从正常聊天请求中删除 messages 字段。'],'结构化 400/422，错误指出 messages。','请求被接受，或服务返回 5xx。','未能确认是缺失字段导致拒绝时，无法判定。',60,true,'POST /v1/chat/completions'],
['validation.wrong_field_type','错误字段类型','异常输入','检查参数类型错误是否得到明确提示。',['把 temperature 改成字符串 "hot" 后发送。'],'结构化 400/422，错误指出 temperature。','请求被接受，或服务返回 5xx。','未能确认拒绝原因时，无法判定。',60,true,'POST /v1/chat/completions'],
['output.small_limit','输出上限生效','边界行为','检查 max_tokens 是否限制了生成长度。',['发送 max_tokens 为 1 的聊天请求。','读取服务返回的 completion_tokens，不独立重算输出 token。'],'回复正常，completion_tokens 为整数 0 或 1。','生成超过 1 个 token，或响应不符合要求。','token 计数缺失或不可用时，无法判定。',60,true,'POST /v1/chat/completions'],
['context.overflow','超出上下文长度','边界行为','确认超长输入被明确拒绝。',['构造长文本，先用 tokenizer 确认输入超过上下文长度。','确认越界后，再发送聊天请求。'],'结构化 400/422，错误指向上下文或长度。','接受超长输入，或返回 5xx。','缺少上下文长度或 tokenizer 时跳过；未证明越界时无法判定。',240,true,'POST /v1/tokenize → /v1/chat/completions'],
['extensions.tools','工具调用能力','可选能力','检查指定工具调用的返回格式。',['提供 get_weather 工具，询问巴黎天气。','使用 tool_choice 指定函数，检查函数名和 city 字符串参数。'],'返回合法工具调用，结束原因为 tool_calls。','已声明支持却返回不合法调用，或返回 5xx。','未声明能力且未测成功时，无法判定。',60,true,'POST /v1/chat/completions'],
['extensions.thinking','思考模式开关','可选能力','检查开启和关闭思考是否产生预期差异。',['对相同请求分别开启和关闭思考。','检查两次响应中的 reasoning_content 字段。'],'开启时有思考内容，关闭时没有，两次格式正常。','已声明支持但开关行为不符，或出现错误响应。','未声明能力且未观察到开启效果时，无法判定。',60,true,'POST /v1/chat/completions × 2'],
['disruption.abort_storm','客户端中断场景','扰动恢复','主动断开部分请求，检查其他请求和服务恢复。',['同时发起 24 个待中断流、8 个正常流和 4 个普通请求。','待中断流分别在第 1、16、64 个内容事件后断开，每组 8 个。','随后最多用 30 秒检查恢复，要求健康检查和聊天连续成功 3 轮。'],'预定中断完成，其他请求正常，恢复检查通过。','正常请求受到影响或观察到恢复失败；保留原始错误。','未能完成预定中断时无法判定；连接或执行异常显示执行出错。',180,false,'POST /v1/chat/completions · 最多 36 个并发请求']
];
const initial=rows.map(r=>({id:r[0],name:r[1],group:r[2],description:r[3],steps:r[4],pass:r[5],fail:r[6],unknown:r[7],timeout:r[8],enabled:r[9],endpoint:r[10]}));let cases=structuredClone(initial), selected=cases[0].id, variant=['A','B','C'].includes(new URLSearchParams(location.search).get('variant'))?new URLSearchParams(location.search).get('variant'):'A';let draft=null, toastTimer;
const $=s=>document.querySelector(s), esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const groups=[...new Set(cases.map(x=>x.group))];$('#group').innerHTML+=groups.map(g=>`<option>${g}</option>`).join('');
function matches(){const q=$('#search').value.trim().toLowerCase();return cases.filter(c=>(!q||[c.name,c.id,c.description].some(v=>v.toLowerCase().includes(q)))&&(!$('#group').value||c.group===$('#group').value)&&(!$('#scope').value||c.enabled===($('#scope').value==='on')))}
function groupBadge(group){const styles={'基础接口':'basic','异常输入':'invalid','边界行为':'boundary','可选能力':'optional','扰动恢复':'disruption'};return `<span class="badge group-badge group-${styles[group]}">${esc(group)}</span>`}
function toggle(c){return `<button class="switch" role="switch" aria-label="${esc(c.name)}：新服务默认选中" aria-checked="${c.enabled}" data-toggle="${c.id}"></button>`}
function detail(c){const d=draft&&draft.id===c.id?draft:c;return `<form class="detail" id="editor"><div class="detail-top"><div><h2>${esc(c.name)}</h2><span class="id">${c.id}</span></div>${groupBadge(c.group)}</div><p class="subtle">${c.description}</p><div class="section"><div class="section-title">怎么执行</div>${c.steps.map((x,i)=>`<div class="step"><i>${i+1}</i><span>${x}</span></div>`).join('')}</div><div class="section"><div class="section-title">怎么判断</div><div class="rules"><div class="rule"><b class="pass">通过</b><span>${c.pass}</span></div><div class="rule"><b class="fail">失败</b><span>${c.fail}</span></div><div class="rule"><b class="unknown">其他情况</b><span>${c.unknown}</span></div></div></div><div class="section"><div class="section-title">执行设置</div><div class="field" style="margin-bottom:18px"><label for="editName">项目名称</label><input id="editName" name="name" style="width:100%" required maxlength="60" value="${esc(d.name)}"></div><div class="fields"><div class="field"><label for="editTimeout">执行超时（秒）</label><input id="editTimeout" name="timeout" type="number" min="1" max="900" step="1" required value="${d.timeout}"><div class="field-note">整个项目的请求共用此时间。${c.group==='扰动恢复'?'恢复检查另有 30 秒预算。':''}</div></div><div class="field"><label class="checkline"><input name="enabled" type="checkbox" ${d.enabled?'checked':''}>新服务默认选中</label><div class="field-note">不改动已保存的服务选择。${c.group==='扰动恢复'?'建议在需要专项验证时选用。':''}</div></div></div></div><div class="section"><details><summary>查看内置请求定义 <span class="badge">只读</span></summary><pre>${esc(c.endpoint)}\n\n${esc(request(c))}</pre></details></div><div class="actions"><span class="subtle" id="editState" style="margin-right:auto">未修改</span><button type="button" data-discard>撤销修改</button><button class="primary" type="submit">保存更改</button></div></form>`}
function request(c){if(c.id==='health.generate')return '无需请求体';if(c.id==='validation.malformed_json')return '{"model":';const p={model:'${服务模型}',messages:[{role:'user',content:'Reply with pong.'}],stream:false};if(c.id==='validation.missing_messages')delete p.messages;if(c.id==='validation.wrong_field_type')p.temperature='hot';if(c.id==='streaming.basic')p.stream=true;if(c.id==='output.small_limit')p.max_tokens=1;if(c.id==='extensions.thinking')return '对同一请求分别设置：\nchat_template_kwargs.enable_thinking = true / false';if(c.id==='context.overflow')return '根据服务声明的上下文长度构造输入；先计数，确认越界后再发送。';if(c.id==='extensions.tools')return 'tools: get_weather(city: string)\ntool_choice: 指定 get_weather\n用户输入：What’s the weather in Paris?';if(c.group==='扰动恢复')return '待中断流：max_tokens 2048，ignore_eos true\n正常流：max_tokens 128，ignore_eos true\n中断依据：已解析的内容事件数，而非精确 token 数。';return JSON.stringify(p,null,2)}
function render(){const list=matches();$('#defaultCount').textContent=cases.filter(c=>c.enabled).length;$('#count').textContent=`显示 ${list.length} / ${cases.length} 项`;document.querySelectorAll('[data-variant]').forEach(b=>b.classList.toggle('active',b.dataset.variant===variant));$('#caption').textContent={A:'方案 A · 表格总览，点击项目在右侧查看和编辑。适合快速查找与批量浏览。',B:'方案 B · 左侧选择，右侧常驻详情。适合逐项阅读和配置。',C:'方案 C · 按检查目的分组。适合第一次了解巡检项目。'}[variant];if(!list.length){$('#view').innerHTML='<div class="surface empty">没有匹配的巡检项目，请调整搜索或筛选条件。</div>';return}if(variant==='A'){$('#view').innerHTML=`<div class="surface table-wrap"><table><thead><tr><th>巡检项目</th><th>分组</th><th>超时</th><th>新服务默认选中</th><th></th></tr></thead><tbody>${list.map(c=>`<tr><td><button class="case-link" data-open="${c.id}">${esc(c.name)}</button><span class="id">${c.id}</span><p class="row-note">${c.description}</p></td><td>${groupBadge(c.group)}</td><td>${c.timeout} 秒</td><td>${toggle(c)}</td><td><button class="plain" data-open="${c.id}">查看详情 ↗</button></td></tr>`).join('')}</tbody></table></div>`}else if(variant==='B'){if(!list.some(c=>c.id===selected))selected=list[0].id;$('#view').innerHTML=`<div class="layout-b"><div class="surface"><div class="list-head">选择巡检项目 · ${list.length} 项</div>${list.map(c=>`<button class="list-row ${selected===c.id?'active':''}" data-open="${c.id}" aria-pressed="${selected===c.id}"><strong>${esc(c.name)}</strong><small><span>${c.group}</span><span>${c.enabled?'默认选中':'按需选择'}</span></small></button>`).join('')}</div><div class="surface">${detail(cases.find(c=>c.id===selected))}</div></div>`;bindEditor()}else{$('#view').innerHTML=`<div class="groups">${groups.filter(g=>list.some(c=>c.group===g)).map(g=>`<section><h2 class="group-title">${g}<small>${list.filter(c=>c.group===g).length} 项</small></h2><div class="cards">${list.filter(c=>c.group===g).map(c=>`<article class="surface card"><h3><button class="case-link" data-open="${c.id}">${esc(c.name)}</button></h3><p>${c.description}</p><div class="card-foot">${toggle(c)}<span>默认选中</span><span class="spacer"></span><span>${c.timeout} 秒</span><button class="plain" data-open="${c.id}" aria-label="查看${esc(c.name)}详情">→</button></div></article>`).join('')}</div></section>`).join('')}</div>`}}
function openItem(id){selected=id;draft=null;if(variant==='B'){render()}else{$('#drawerContent').innerHTML=detail(cases.find(c=>c.id===id));$('#drawer').showModal();bindEditor()}}
function bindEditor(){const form=$('#editor');if(!form)return;form.oninput=()=>{draft={id:selected,name:form.elements.name.value,timeout:Number(form.elements.timeout.value),enabled:form.elements.enabled.checked};$('#editState').textContent='有未保存的修改';$('#editState').classList.add('unsaved')};form.onsubmit=e=>{e.preventDefault();const c=cases.find(c=>c.id===selected);const name=form.elements.name.value.trim();if(!name){form.elements.name.setCustomValidity('请输入项目名称');form.elements.name.reportValidity();form.elements.name.oninput=()=>form.elements.name.setCustomValidity('');return}Object.assign(c,{name,timeout:Number(form.elements.timeout.value),enabled:form.elements.enabled.checked});draft=null;if($('#drawer').open){$('#drawerContent').innerHTML=detail(c);bindEditor()}render();toast('已保存 · 仅更新当前原型中的默认配置')};form.querySelector('[data-discard]').onclick=()=>{draft=null;if(variant==='B')render();else{$('#drawerContent').innerHTML=detail(cases.find(c=>c.id===selected));bindEditor()}}}
function toast(msg){clearTimeout(toastTimer);$('#toast').textContent=msg;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,3000)}
function changeVariant(){/* Layout A has been selected; layout switching is disabled. */}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.open)openItem(b.dataset.open);if(b.dataset.toggle){const c=cases.find(c=>c.id===b.dataset.toggle);c.enabled=!c.enabled;render();toast(`${c.name}：${c.enabled?'新服务默认选中':'改为按需选择'}`)}if(b.dataset.variant)changeVariant(b.dataset.variant);if(b.dataset.cycle){const all=['A','B','C'];changeVariant(all[(all.indexOf(variant)+Number(b.dataset.cycle)+3)%3])}});
$('#close').onclick=()=>$('#drawer').close();$('#drawer').addEventListener('click',e=>{if(e.target===$('#drawer')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left)$('#drawer').close()}});for(const key of ['search','group','scope'])$('#'+key).addEventListener(key==='search'?'input':'change',()=>{draft=null;render()});$('#restore').onclick=()=>{cases=structuredClone(initial);draft=null;$('#drawer').close();render();toast('已恢复初始模拟设置')};document.addEventListener('keydown',e=>{if($('#drawer').open||e.target.closest('input,textarea,select,button,[contenteditable]'))return;if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const all=['A','B','C'];changeVariant(all[(all.indexOf(variant)+(e.key==='ArrowRight'?1:2))%3])}});render();
variant='A';render();
</script>
</body></html>
