const COLORS=['#64748b','#3b82f6','#06b6d4','#8b5cf6','#f59e0b'];
const WORKLOADS=[
 {id:'prefill',name:'prefill-1k-128',shape:'合成数据 · 输入 1,000 / 输出上限 128 tokens',input:1000,output:128,delay:140},
 {id:'balanced',name:'balanced-2k-1k',shape:'合成数据 · 输入 2,048 / 输出上限 1,024 tokens',input:2048,output:1024,delay:230},
 {id:'long',name:'long-context-8k',shape:'合成数据 · 输入 8,192 / 输出上限 512 tokens',input:8192,output:512,delay:490},
 {id:'sharegpt',name:'sharegpt',shape:'真实数据集 · ShareGPT',input:1350,output:380,delay:180}
];
const LEVELS={concurrency:[1,4,8,16,32,64],qps:[1,2,4,8,16,32]};
const METRICS=[
 {key:'rps',title:'请求吞吐',unit:'req/s',digits:2,group:'efficiency',note:'成功请求数 / 正式压测总耗时'},
 {key:'actual',title:'实际并发',unit:'请求数',digits:1,group:'efficiency',note:'时间平均在途请求数'},
 {key:'inputThroughput',title:'输入吞吐',unit:'tok/s',digits:1,group:'efficiency',note:'成功请求输入 Token 总量 / 正式压测总耗时'},
 {key:'outputThroughput',title:'输出吞吐',unit:'tok/s',digits:1,group:'efficiency',note:'成功请求输出 Token 总量 / 正式压测总耗时'},
 {key:'successRate',title:'成功率',unit:'%',digits:1,group:'latency',note:'成功请求数 / 总请求数'},
 {key:'ttft',title:'TTFT · 首 Token 延迟',unit:'ms',digits:1,group:'latency',note:'每个成功请求 · 不含等待并发许可的时间',distribution:true},
 {key:'tpot',title:'TPOT · 每 Token 延迟',unit:'ms',digits:1,group:'latency',note:'每个成功请求 · 后续输出 Token 的平均间隔',distribution:true},
 {key:'e2e',title:'E2E · 请求总延迟',unit:'ms',digits:1,group:'latency',note:'每个成功请求 · 不含等待并发许可的时间',distribution:true}
];
function sampleDistribution(mean){return {Mean:mean,P50:mean*.89,P70:mean*1.08,P95:mean*1.52,P99:mean*1.91};}
const REPORT=WORKLOADS.map((w,wi)=>({...w,cells:Object.entries(LEVELS).flatMap(([mode,levels])=>levels.map((level,i)=>{
 const pending=w.id==='sharegpt'&&mode==='qps'&&i===5;
 const ttft=w.delay*[1,1.1,1.3,1.7,2.7,4.6][i],tpot=12+i*2.5+(w.id==='long'?8:0),e2e=ttft+(w.output-1)*tpot;
 const rps=mode==='concurrency'?level*.94/(e2e/1000):Math.min(level*.995,64/(e2e/1000));
 const failed=i===5?(w.id==='long'?24:5):0,total=1000,success=total-failed,duration=success/rps;
 const cell={mode,level,status:pending?'pending':'completed',stale:w.id==='long'&&mode==='concurrency'&&i===4,time:null,
  total:pending?null:total,success:pending?null:success,failed:pending?null:failed,duration:pending?null:duration,metrics:{}};
 cell.time=pending?null:'09-29 '+String(9+wi).padStart(2,'0')+':'+String(i*8).padStart(2,'0');
 cell.metrics=pending?{}:{rps,actual:rps*e2e/1000,inputThroughput:rps*w.input,outputThroughput:rps*w.output,successRate:success/total*100,ttft:sampleDistribution(ttft),tpot:sampleDistribution(tpot),e2e:sampleDistribution(e2e)};
 cell.tokens=pending?null:{input:w.id==='sharegpt'?sampleDistribution(w.input):Object.fromEntries(PERCENTILES.map(p=>[p,w.input])),output:w.id==='sharegpt'?sampleDistribution(w.output):Object.fromEntries(PERCENTILES.map(p=>[p,w.output]))};
 // Deliberately missing one statistic to demonstrate honest gaps.
 if(w.id==='long'&&mode==='concurrency'&&i===2)cell.metrics.tpot.P70=null;
 return cell;
}))}));
const $=id=>document.getElementById(id);
let mode='concurrency';
const hiddenSeries=new Map();
const CHART_METRICS=['outputThroughput','e2e','ttft','tpot'].map(key=>METRICS.find(m=>m.key===key));
const viewState=new Map();
function stateFor(w){if(!viewState.has(w.id))viewState.set(w.id,{view:"charts",latency:"ttft",target:null});return viewState.get(w.id);}
function fmt(n,digits=1){return n==null||!Number.isFinite(n)?'—':n.toLocaleString('en-US',{minimumFractionDigits:digits,maximumFractionDigits:digits});}
function levelLabel(){return mode==='qps'?'提供 QPS':'并发';}
function cellsOf(w){return w.cells.filter(c=>c.mode===mode).sort((a,b)=>a.level-b.level);}
function value(cell,metric,series){return metric.distribution?cell.metrics[metric.key]?.[series]??null:cell.metrics[metric.key]??null;}
function seriesFor(metric){return metric.distribution?PERCENTILES:['value'];}
function cardId(w,metric){return w.id+'-'+metric.key;}
function isVisible(id,series){return !hiddenSeries.get(mode+':'+id)?.has(series);}
function short(n){return n>=1000?fmt(n/1000,1)+'k':fmt(n,n<10?1:0);}
function metricCard(w,metric,cells){
 const id=cardId(w,metric),series=seriesFor(metric);
 return '<article class="metric" id="'+id+'"><div class="metric-head"><h4>'+metric.title+'</h4><div><span class="unit">'+metric.unit+'</span><button class="data-link" data-target="'+metric.key+'" aria-label="查看'+metric.title+'数据表">查看数据 ↗</button></div></div><div class="chart"></div><div class="legend">'+series.map((s,i)=>'<button data-series="'+s+'" aria-pressed="'+isVisible(id,s)+'" aria-label="'+metric.title+'：'+(s==='value'?'测量值':s)+'"><span class="dot" style="background:'+(metric.distribution?COLORS[i]:'var(--accent)')+'"></span>'+(s==='value'?'测量值':s)+'</button>').join('')+'</div><div class="metric-foot">'+metric.note+'</div></article>';
}
function tokenTable(w,cells){
 return '<section class="data-section latency-card" id="data-tokens-'+w.id+'"><div class="data-head"><h3>Token 用量</h3><span class="unit">输入 / 输出 · tokens</span></div><div class="scroll"><table><thead><tr><th>'+levelLabel()+'</th>'+PERCENTILES.map(p=>'<th>'+p+'</th>').join('')+'</tr></thead><tbody>'+cells.map(c=>'<tr><td>'+c.level+'</td>'+PERCENTILES.map(p=>{const input=c.tokens?.input?.[p],output=c.tokens?.output?.[p];return '<td>'+(input==null&&output==null?'—':fmt(input,0)+'/'+fmt(output,0))+'</td>';}).join('')+'</tr>').join('')+'</tbody></table></div><div class="table-note">每格以 Input tokens / Output tokens 展示</div></section>';
}
function dataTables(w,cells){
 const state=stateFor(w),scalars=['actual','successRate','rps','inputThroughput','outputThroughput'].map(key=>METRICS.find(m=>m.key===key));
 return '<section class="data-section workload-overview" id="data-scalar-'+w.id+'" tabindex="-1"><div class="data-head"><h3>运行概览</h3><span class="unit">按档位汇总</span></div><div class="scroll"><table><thead><tr><th>'+levelLabel()+'</th>'+scalars.map(m=>'<th class="'+(state.target===m.key?'target-column':'')+'">'+m.title+(m.unit==='req/s'||m.unit==='tok/s'?' <span class="unit">'+m.unit+'</span>':'')+'</th>').join('')+'</tr></thead><tbody>'+cells.map(c=>'<tr><td>'+c.level+'</td>'+scalars.map(m=>'<td class="'+(state.target===m.key?'target-column':'')+'">'+fmt(value(c,m,'value'),m.digits)+(m.key==='successRate'&&value(c,m,'value')!=null?'%':'')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><div class="table-note">实际并发为时间平均在途请求数；吞吐量为正式压测阶段的成功请求或 token 总量除以总耗时</div></section>'+
 '<div class="latency-tables"><div class="section-head"><h3>延迟与 Token</h3><span class="unit">按成功请求统计</span></div><div class="metric-grid">'+tokenTable(w,cells)+['e2e','ttft','tpot'].map(key=>{
 const m=METRICS.find(m=>m.key===key);
 return '<section class="data-section latency-card" id="data-'+key+'-'+w.id+'" tabindex="-1"><div class="data-head"><h3>'+key.toUpperCase()+'</h3><span class="unit">ms</span></div><div class="scroll"><table><thead><tr><th>'+levelLabel()+'</th>'+PERCENTILES.map(p=>'<th>'+p+'</th>').join('')+'</tr></thead><tbody>'+cells.map(c=>'<tr><td>'+c.level+'</td>'+PERCENTILES.map(p=>'<td>'+fmt(value(c,m,p),1)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><div class="table-note">每个成功请求 · 按档位统计</div></section>';
 }).join('')+'</div></div>';
}
function updateView(w,target){
 const state=stateFor(w),section=$('workload-'+w.id);
 section.querySelector('[data-panel="charts"]').hidden=state.view!=='charts';
 section.querySelector('[data-panel="tables"]').hidden=state.view!=='tables';
 section.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===state.view)));
 $('tooltip').hidden=true;
 if(state.view==='tables'){
  section.querySelector('[data-panel="tables"]').innerHTML=dataTables(w,cellsOf(w));
 }
 if(target){const table=$('data-'+(METRICS.find(m=>m.key===target).distribution?target:'scalar')+'-'+w.id);table.focus({preventScroll:true});table.scrollIntoView({block:'start',behavior:'instant'});}
}
function render(){
 $('tooltip').hidden=true;document.body.dataset.mode=mode;
 $('report').setAttribute('aria-labelledby','tab-'+mode);
 $('report').innerHTML=REPORT.map((w,index)=>{
  const cells=cellsOf(w),completed=cells.filter(c=>c.status==='completed').length,state=stateFor(w),failed=cells.filter(c=>c.failed>0).length,pending=cells.filter(c=>c.status!=='completed').length,stale=cells.filter(c=>c.stale).length;
  return '<section class="workload" id="workload-'+w.id+'" aria-labelledby="heading-'+w.id+'"><div class="workload-head"><div class="workload-title"><span class="number">'+String(index+1).padStart(2,'0')+'</span><div><h2 id="heading-'+w.id+'">'+w.name+'</h2><p>'+w.shape+'</p></div></div><div class="pills"><span class="pill mode-pill">'+(mode==='qps'?'QPS 测试':'并发测试')+'</span><span class="pill"><b>'+completed+' / '+cells.length+'</b> 项已完成</span>'+(failed?'<span class="pill attention">'+failed+' 档含失败请求</span>':'')+(pending?'<span class="pill">'+pending+' 档未执行</span>':'')+(stale?'<span class="pill attention">'+stale+' 档旧配置</span>':'')+'</div></div><div class="body"><div class="view-bar"><div class="view-switch" role="group" aria-label="'+w.name+'报告视图"><button data-view="charts" aria-pressed="'+(state.view==='charts')+'" aria-controls="charts-'+w.id+'">曲线</button><button data-view="tables" aria-pressed="'+(state.view==='tables')+'" aria-controls="tables-'+w.id+'">数据表</button></div><p>图表看趋势 · 表格查数值</p></div><div id="charts-'+w.id+'" data-panel="charts" '+(state.view==='charts'?'':'hidden')+'><div class="metric-grid">'+CHART_METRICS.map(m=>metricCard(w,m,cells)).join('')+'</div></div><div id="tables-'+w.id+'" data-panel="tables" '+(state.view==='tables'?'':'hidden')+'>'+dataTables(w,cells)+'</div></div></section>';
 }).join('');
 for(const w of REPORT){
  const section=$('workload-'+w.id),state=stateFor(w);
  section.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;state.target=null;updateView(w);});
  section.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>{
   const m=METRICS.find(m=>m.key===b.dataset.target);
   state.view='tables';state.target=m.key;if(m.distribution)state.latency=m.key;updateView(w,m.key);
  });
  updateView(w);
 }
 for(const w of REPORT)for(const metric of CHART_METRICS){
  drawChart(w,metric);
  const id=cardId(w,metric);
  $(id).querySelectorAll('.legend button').forEach(button=>button.addEventListener('click',()=>{
   const key=mode+':'+id,hidden=hiddenSeries.get(key)??new Set(),series=button.dataset.series;
   hidden.has(series)?hidden.delete(series):hidden.add(series);hiddenSeries.set(key,hidden);
   button.setAttribute('aria-pressed',String(!hidden.has(series)));$('tooltip').hidden=true;drawChart(w,metric);
  }));
 }
}
function drawChart(w,metric){
 const card=$(cardId(w,metric)),cells=cellsOf(w),series=seriesFor(metric).filter(s=>isVisible(card.id,s));
 const measured=cells.flatMap(c=>series.map(s=>value(c,metric,s))).filter(v=>v!=null);
 const max=metric.key==='successRate'?100:Math.max(1,...measured)*1.12;
 const left=55,right=535,top=18,bottom=170;
 // Explicit categorical axis: equal spacing makes every tested level legible.
 const x=i=>left+i*(right-left)/Math.max(1,cells.length-1),y=n=>bottom-n/max*(bottom-top);
 let svg='<svg viewBox="0 0 580 213" role="group" aria-label="'+w.name+' '+metric.title+' 随'+levelLabel()+'档位变化">';
 for(let i=0;i<=4;i++){const n=max*i/4;svg+='<line class="grid" x1="'+left+'" x2="'+right+'" y1="'+y(n)+'" y2="'+y(n)+'" stroke-dasharray="3 4"/><text x="'+(left-10)+'" y="'+(y(n)+3)+'" text-anchor="end" font-size="9">'+short(n)+'</text>';}
 cells.forEach((c,i)=>svg+='<text x="'+x(i)+'" y="187" text-anchor="middle" font-size="9">'+c.level+'</text>');
 svg+='<text x="'+right+'" y="207" text-anchor="end" font-size="9">'+levelLabel()+'档位 · 分类轴</text>';
 series.forEach(s=>{
  const color=metric.distribution?COLORS[PERCENTILES.indexOf(s)]:'var(--accent)';
  let segment=[];
  function finish(){if(segment.length)svg+='<polyline points="'+segment.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="1.8" stroke-linejoin="round"/>';segment=[];}
  cells.forEach((c,i)=>{const n=value(c,metric,s);if(n==null){finish();return;}segment.push(x(i)+','+y(n));});finish();
  cells.forEach((c,i)=>{const n=value(c,metric,s);if(n==null)return;svg+='<circle tabindex="0" role="img" aria-label="'+metric.title+'，'+levelLabel()+' '+c.level+'，'+(s==='value'?'测量值':s)+' '+fmt(n,metric.digits)+' '+metric.unit+'" data-index="'+i+'" data-series="'+s+'" cx="'+x(i)+'" cy="'+y(n)+'" r="3.8" fill="var(--surface)" stroke="'+color+'" stroke-width="1.7"/>';});
 });
 if(!measured.length)svg+='<text x="290" y="98" text-anchor="middle" font-size="12">'+(series.length?'暂无测量结果':'已隐藏全部曲线，点击图例恢复')+'</text>';
 card.querySelector('.chart').innerHTML=svg+'</svg>';
 card.querySelectorAll('circle').forEach(point=>{
  const cell=cells[+point.dataset.index];
  const show=e=>{
   const tooltip=$('tooltip');
   tooltip.textContent=w.name+' · '+levelLabel()+' '+cell.level+'\n'+metric.title+' ('+metric.unit+')\n'+seriesFor(metric).map(s=>(s==='value'?'测量值':s)+'  '+fmt(value(cell,metric,s),metric.digits)).join('\n')+'\n测于 '+cell.time+(cell.stale?' · 旧配置快照':'');
   tooltip.hidden=false;
   const rect=point.getBoundingClientRect();
   const px=e.clientX??rect.x,py=e.clientY??rect.y;
   tooltip.style.left=Math.max(8,Math.min(px+14,innerWidth-tooltip.offsetWidth-10))+'px';
   tooltip.style.top=Math.max(8,Math.min(py+14,innerHeight-tooltip.offsetHeight-10))+'px';
  };
  const hide=()=>{$('tooltip').hidden=true;};
  ['mouseenter','mousemove','focus','click'].forEach(event=>point.addEventListener(event,show));
  ['mouseleave','blur'].forEach(event=>point.addEventListener(event,hide));
 });
}
function activateMode(next){
 const activeId=location.hash.startsWith('#workload-')?location.hash.slice(1):document.querySelector('#workload-nav a[aria-current]')?.hash.slice(1);
 const current=activeId?$(activeId):null;
 const offset=current?24:null;
 const expanded=[...document.querySelectorAll('.workload details[open]')].map(d=>({id:d.closest('.workload').id,kind:d.className}));
 mode=next;
 document.querySelectorAll('[data-mode][role="tab"]').forEach(tab=>{const active=tab.dataset.mode===mode;tab.setAttribute('aria-selected',String(active));tab.tabIndex=active?0:-1;});
 render();
 expanded.forEach(d=>$(d.id)?.querySelector('details.'+d.kind)?.setAttribute('open',''));
 if(activeId&&offset!=null){const restore=()=>{const target=$(activeId);window.scrollTo({top:window.scrollY+target.getBoundingClientRect().top-offset,behavior:'instant'});highlightSection(activeId);};restore();requestAnimationFrame(restore);}
}
document.querySelectorAll('[role="tab"]').forEach(tab=>{
 tab.addEventListener('click',()=>activateMode(tab.dataset.mode));
 tab.addEventListener('keydown',event=>{
  if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
  event.preventDefault();
  const next=event.key==='Home'?'concurrency':event.key==='End'?'qps':mode==='qps'?'concurrency':'qps';
  activateMode(next);$('tab-'+next).focus();
 });
});
document.querySelector('#workload-nav nav p').textContent='Workload · '+REPORT.length;
// Sidebar markup is generated from the same SidebarNav component used by app Nav.
const sidebarLinks=[...document.querySelectorAll('#workload-nav a')];
function highlightSection(id){sidebarLinks.forEach(a=>{const active=a.hash==='#'+id;a.toggleAttribute('data-active',active);if(active)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current');});}
sidebarLinks.forEach(a=>a.addEventListener('click',event=>{event.preventDefault();const id=a.hash.slice(1);$(id).scrollIntoView({block:'start',behavior:'instant'});highlightSection(id);history.replaceState(null,'',a.hash);}));
function trackSection(){const sections=[...document.querySelectorAll('.workload')];const current=sections.filter(s=>s.getBoundingClientRect().top<=60).at(-1)||sections[0];if(current)highlightSection(current.id);}
window.addEventListener('scroll',trackSection,{passive:true});
$('print').addEventListener('click',()=>window.print());
$('export').addEventListener('click',()=>{
 const headers=['数据性质','Workload','模式','档位','状态','旧配置','执行时间','总请求','成功','失败','耗时(s)',...METRICS.flatMap(m=>seriesFor(m).map(s=>m.title+' '+(s==='value'?'':s)+' ('+m.unit+')')),...PERCENTILES.flatMap(p=>['Input tokens '+p,'Output tokens '+p])];
 const rows=REPORT.flatMap(w=>w.cells.map(c=>['示例数据',w.name,c.mode,c.level,c.status,c.stale,c.time,c.total,c.success,c.failed,c.duration,...METRICS.flatMap(m=>seriesFor(m).map(s=>value(c,m,s))),...PERCENTILES.flatMap(p=>[c.tokens?.input?.[p],c.tokens?.output?.[p]])]));
 const csv='\ufeff'+[headers,...rows].map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');
 const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');
 a.href=url;a.download='deployment-report-all-workloads.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('tooltip').hidden=true;});
window.addEventListener('scroll',()=>$('tooltip').hidden=true,true);
render();trackSection();
</script>
</body>
</html>
